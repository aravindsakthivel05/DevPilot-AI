[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot-ai"
version = "0.1.0"
description = "Structure-aware repository intelligence and evidence-grounded suggestions"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "tree-sitter>=0.25,<0.26", "tree-sitter-java>=0.23,<0.24", "tree-sitter-python==0.25.0", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2", "tree-sitter-c==0.24.2", "tree-sitter-cpp==0.23.4", "tree-sitter-go==0.25.0", "tree-sitter-rust==0.24.2", "tree-sitter-c-sharp==0.23.5", "numpy>=2,<3", "snowballstemmer>=3,<4"]

[project.optional-dependencies]
reranking = ["sentence-transformers>=5,<6"]
orchestration = ["langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4"]
dev = ["pytest>=8,<10", "ruff>=0.16,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
